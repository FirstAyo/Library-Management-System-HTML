<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>Add Book — LMS</title><link rel='stylesheet' href='../common/css/base.css'><link rel='stylesheet' href='css/add-book.css'><script src='https://code.jquery.com/jquery-3.7.1.min.js' integrity='sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=' crossorigin='anonymous'></script><script src='../common/js/ui.js' defer></script><script src='../common/js/auth.js' defer></script><script src='../common/js/data.js' defer></script></head><body><script>window.addEventListener('DOMContentLoaded', function(){ LMS_AUTH.requireLogin('admin'); });</script><header class='header'></header><main class='page'><div class='container'>
